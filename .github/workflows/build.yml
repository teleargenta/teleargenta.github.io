name: Compilar APK Android (TeleArgenta)

on:
  workflow_dispatch: # Permite ejecutar la compilación manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17 (Java)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x gradlew || true

      - name: Compilar APK (Debug)
        run: ./gradlew assembleDebug

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: TeleArgenta-APK
          path: app/build/outputs/apk/debug/app-debug.apk
