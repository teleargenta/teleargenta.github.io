<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleArgenta - Televisión Abierta</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        /* Efecto de líneas de escaneo de TV clásica (CRT) */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        .container {
            max-width: 600px;
            padding: 20px;
            z-index: 3;
        }
        .logo-container {
            position: relative;
            margin-bottom: 24px;
            display: inline-block;
        }
        /* Icono de transmisión pulsante */
        .broadcast-icon {
            width: 80px;
            height: 80px;
            border: 4px solid var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 0 20px var(--accent-glow);
            animation: pulse 2s infinite;
        }
        .broadcast-icon::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: var(--accent-color);
            border-radius: 50%;
        }
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7);
            }
            70% {
                box-shadow: 0 0 0 20px rgba(56, 189, 248, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(56, 189, 248, 0);
            }
        }
        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        h1 span {
            color: var(--accent-color);
            -webkit-text-fill-color: var(--accent-color);
        }
        p.subtitle {
            font-size: 1.25rem;
            color: #94a3b8;
            margin: 0 0 30px 0;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .badge {
            background-color: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: var(--accent-color);
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            display: inline-block;
            margin-bottom: 20px;
        }
        p.description {
            font-size: 1rem;
            color: #64748b;
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <div class="broadcast-icon"></div>
        </div>
        <div>
            <div class="badge">Próximamente</div>
        </div>
        <h1>Tele<span>Argenta</span></h1>
        <p class="subtitle">Televisión Abierta de Argentina</p>
        <p class="description">Un espacio dedicado a grillas de canales, frecuencias de TDA, historia de nuestras emisoras y el mapa de transmisión en todo el país.</p>
    </div>
</body>
</html>
