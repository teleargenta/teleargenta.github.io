<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleArgenta — Prueba de Cards</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #0a0a0a; color: #eee; padding: 20px; }
        h2 { color: #555; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin: 24px 0 10px; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; flex-direction: column; }
        .overlay.activo { display: flex; }
        .overlay-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: #111; border-bottom: 1px solid #222; flex-shrink: 0; }
        .overlay-titulo { font-size: 14px; font-weight: bold; color: #fff; }
        .overlay-ciudad { font-size: 11px; color: #555; margin-left: 8px; }
        .btn-cerrar { background: #c0392b; border: none; color: #fff; padding: 9px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .overlay-player { flex: 1; width: 100%; background: #111; position: relative; overflow: hidden; }
        .overlay-player iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .overlay-nav { display: flex; justify-content: center; align-items: center; gap: 16px; padding: 12px 16px; background: #111; border-top: 1px solid #1a1a1a; flex-shrink: 0; }
        .btn-nav { background: #1a1a1a; border: 2px solid #333; color: #fff; padding: 12px 32px; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; }
        .btn-nav:hover { background: #0077ff; border-color: #0077ff; }
        .overlay-canal-info { color: #555; font-size: 12px; min-width: 80px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 10px; }
        .card { background: #161616; border-radius: 12px; border: 1px solid #1e1e1e; padding: 14px 10px 12px; text-align: center; cursor: pointer; transition: 0.2s; position: relative; }
        .card:hover { border-color: #0077ff; background: #1a1a1a; transform: translateY(-2px); }
        .card.active { border-color: #0077ff; background: #0d1a2e; }
        .card[data-tipo="sin"] { cursor: default; opacity: 0.6; }
        .card[data-tipo="sin"]:hover { transform: none; border-color: #1e1e1e; background: #161616; }
        .card-logo-wrap { width: 80px; height: 45px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; }
        .card-logo-wrap img { max-width: 80px; max-height: 45px; object-fit: contain; filter: brightness(0.85); }
        .card-logo-text { font-size: 13px; font-weight: 900; color: #333; letter-spacing: -0.5px; text-align: center; line-height: 1.1; }
        .card-name { font-size: 11px; font-weight: bold; color: #ddd; margin-bottom: 2px; line-height: 1.3; min-height: 26px; display: flex; align-items: center; justify-content: center; }
        .card-city { font-size: 9px; color: #4a4a4a; text-transform: uppercase; margin-bottom: 8px; }
        .badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-bottom: 8px; }
        .badge { font-size: 8px; padding: 2px 5px; border-radius: 4px; font-weight: bold; }
        .badge-pub  { background: #0d2a0d; color: #4caf50; }
        .badge-priv { background: #0d1a3a; color: #5c8aff; }
        .badge-univ { background: #2a1a00; color: #ff9800; }
        .badge-com  { background: #1a1a00; color: #cddc39; }
        .badge-rel  { background: #2a0d0d; color: #ff5252; }
        .badge-nosenal { background: #2a2a2a; color: #666; }
        .badge-tipo { position: absolute; top: 7px; right: 7px; font-size: 7px; padding: 2px 4px; border-radius: 3px; font-weight: bold; }
        .btn-ver { width: 100%; padding: 8px; border: none; border-radius: 7px; font-weight: bold; font-size: 11px; cursor: pointer; transition: 0.2s; }
        .btn-ver.play { background: #0077ff; color: #fff; }
        .btn-ver.play:hover { background: #005fcc; }
        .btn-ver.yt-link { background: #ff0000; color: #fff; }
        .btn-ver.yt-link:hover { background: #cc0000; }
        .btn-ver.sin { background: #1a1a1a; color: #444; cursor: default; border: 1px solid #222; }
    </style>
</head>
<body>
