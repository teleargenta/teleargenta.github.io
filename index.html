<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleArgenta — TV Abierta en Vivo</title>
    <meta property="og:title" content="TeleArgenta" />
    <meta property="og:description" content="Todos los canales de la televisión abierta argentina en un solo lugar." />
    <meta property="og:type" content="website" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #0a0a0a; color: #eee; min-height: 100vh; }
        header { text-align: center; padding: 22px 20px 12px; background: linear-gradient(180deg,#111 0%,#0a0a0a 100%); border-bottom: 1px solid #1a1a1a; }
        .logo-texto { font-size: 1.8rem; font-weight: 900; letter-spacing: -1px; color: #fff; text-transform: uppercase; }
        .logo-sub { font-size: 0.9rem; color: #0077ff; font-weight: bold; margin-top: 4px; display: block; }
        .logo-contador { font-size: 11px; color: #444; display: block; margin-top: 4px; }
        .parentesis { color: #333; font-weight: 300; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; flex-direction: column; }
        .overlay.activo { display: flex; }
        .overlay-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: #111; border-bottom: 1px solid #222; flex-shrink: 0; }
        .overlay-titulo { font-size: 14px; font-weight: bold; color: #fff; }
        .overlay-ciudad { font-size: 11px; color: #555; margin-left: 8px; }
        .btn-cerrar { background: #222; border: 1px solid #444; color: #fff; padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .btn-cerrar:hover { background: #333; }
        .overlay-player { flex: 1; width: 100%; background: #000; }
        .overlay-player iframe { width: 100%; height: 100%; border: none; }
        .overlay-nav { display: flex; justify-content: center; gap: 12px; padding: 10px; background: #111; border-top: 1px solid #1a1a1a; flex-shrink: 0; }
        .btn-nav { background: #1a1a1a; border: 1px solid #333; color: #ccc; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .btn-nav:hover { background: #0077ff; border-color: #0077ff; color: #fff; }
        .filters { display: flex; overflow-x: auto; gap: 8px; padding: 10px 12px; scrollbar-width: none; background: #0d0d0d; }
        .filters::-webkit-scrollbar { display: none; }
        .filters button { padding: 7px 14px; border: 1px solid #333; border-radius: 20px; background: #1a1a1a; color: #bbb; cursor: pointer; font-size: 12px; white-space: nowrap; transition: 0.2s; }
        .filters button.activo { background: #0077ff; border-color: #0077ff; color: #fff; }
        .search { width: 92%; margin: 8px auto; }
        .search input { width: 100%; padding: 11px 14px; border-radius: 10px; background: #1a1a1a; color: #fff; border: 1px solid #2a2a2a; outline: none; font-size: 14px; }
        .search input:focus { border-color: #0077ff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 10px; padding: 12px; }
        .card { background: #161616; border-radius: 12px; border: 1px solid #1e1e1e; padding: 14px 10px 12px; text-align: center; cursor: pointer; transition: 0.2s; position: relative; }
        .card:hover { border-color: #0077ff; background: #1a1a1a; transform: translateY(-2px); }
        .card.active { border-color: #0077ff; background: #0d1a2e; }
        .card-name { font-size: 11px; font-weight: bold; color: #ddd; margin-bottom: 2px; line-height: 1.3; min-height: 28px; display: flex; align-items: center; justify-content: center; }
        .card-city { font-size: 9px; color: #4a4a4a; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px; }
        .badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-bottom: 10px; min-height: 18px; }
        .badge { font-size: 8px; padding: 2px 5px; border-radius: 4px; font-weight: bold; line-height: 1.4; }
        .badge-pub { background: #0d2a0d; color: #4caf50; }
        .badge-priv { background: #0d1a3a; color: #5c8aff; }
        .badge-univ { background: #2a1a00; color: #ff9800; }
        .badge-com { background: #1a1a00; color: #cddc39; }
        .badge-rel { background: #2a0d0d; color: #ff5252; }
        .badge-nosenal { background: #2a2a2a; color: #666; }
        .badge-tipo { position: absolute; top: 7px; right: 7px; font-size: 7px; padding: 2px 4px; border-radius: 3px; font-weight: bold; }
        .btn-ver { width: 100%; padding: 8px; border: none; border-radius: 7px; background: #0077ff; color: #fff; cursor: pointer; font-weight: bold; font-size: 11px; transition: 0.2s; }
        .btn-ver:hover { background: #005fcc; }
        .btn-ver.sin { background: #1a1a1a; color: #555; cursor: default; border: 1px solid #222; }
        footer { text-align: center; padding: 35px 20px; font-size: 11px; color: #333; margin-top: 20px; border-top: 1px solid #111; }
        .btn-contacto { display: inline-block; margin-top: 10px; padding: 8px 16px; background: #1a1a1a; color: #666; text-decoration: none; border-radius: 7px; border: 1px solid #2a2a2a; font-size: 11px; }
        @media (max-width: 480px) { .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; padding: 8px; } .logo-texto { font-size: 1.4rem; } }
    </style>
</head>
<body>
<header>
    <h1 class="logo-texto"><span class="parentesis">(</span>TELE<span class="parentesis">)</span>ARGENTA</h1>
    <span class="logo-sub">TELEVISIÓN ABIERTA EN VIVO</span>
    <span class="logo-contador" id="contadorCanales"></span>
</header>
<div class="overlay" id="overlay">
    <div class="overlay-header">
        <div>
            <span class="overlay-titulo" id="overlayTitulo"></span>
            <span class="overlay-ciudad" id="overlayCiudad"></span>
        </div>
        <button class="btn-cerrar" onclick="cerrarOverlay()">✕ Cerrar</button>
    </div>
    <div class="overlay-player" id="overlayPlayer"></div>
    <div class="overlay-nav">
        <button class="btn-nav" onclick="canalAnterior()">◀ Anterior</button>
        <button class="btn-nav" onclick="canalSiguiente()">Siguiente ▶</button>
    </div>
</div>
<div class="filters">
    <button onclick="filtrar('todas')" class="activo">Todas</button>
    <button onclick="filtrar('nacional')">Nacional TDA</button>
    <button onclick="filtrar('amba')">AMBA</button>
    <button onclick="filtrar('bsas')">Bs. As.</button>
    <button onclick="filtrar('centro')">Centro</button>
    <button onclick="filtrar('norte')">Norte</button>
    <button onclick="filtrar('cuyo')">Cuyo</button>
    <button onclick="filtrar('patagonia')">Patagonia</button>
</div>
<div class="search">
    <input type="text" id="searchInput" onkeyup="buscar()" placeholder="Buscar canal o ciudad...">
</div>
<div class="grid" id="grid">
